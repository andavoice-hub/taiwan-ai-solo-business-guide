(const [label,key] of [['適合誰','audience'],['成本（金額與時間）','cost'],['可衡量結果／可能收益','revenue'],['照做步驟','steps'],['證據等級','evidence'],['來源連結','sources'],['風險與紅線','risk']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;if(key==='sources'){for(const s of x.sources){const a=document.createElement('a');a.href=s.url;a.textContent=s.name;a.rel='noopener noreferrer';a.target='_blank';dd.append(a)}const time=document.createElement('small');time.textContent=`查證日期：${x.checked}`;dd.append(time)}else dd.textContent=x[key]+(key==='evidence'&&x.reverse?'；反常識':'');dl.append(dt,dd)}article.append(dl);list.append(article)}}search.addEventListener('input',render);category.addEventListener('change',render);render();</script></body></html>
