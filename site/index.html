onst h=document.createElement('h2'),intro=document.createElement('p');h.textContent=current;intro.textContent=`一句話懂：${sections[current][0]}`;list.append(h,intro)}const article=document.createElement('article');const title=document.createElement('h2');title.textContent=`${String(x.id).padStart(3,'0')}｜${x.conclusion}`;article.append(title);const dl=document.createElement('dl');for(const [label,key] of [['適合誰','audience'],['成本（金額與時間）','cost'],['看什麼結果','revenue'],['照做步驟','steps'],['資料性質','evidence'],['來源連結','sources'],['留意','risk']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;if(key==='sources'){for(const s of x.sources){const a=document.createElement('a');a.href=s.url;a.textContent=s.name;a.rel='noopener noreferrer';a.target='_blank';dd.append(a)}const time=document.createElement('small');time.textContent=`查證日期：${x.checked}`;dd.append(time)}else dd.textContent=x[key];dl.append(dt,dd)}article.append(dl);list.append(article)}if(current){const action=document.createElement('p');action.textContent=`你現在可以做的一件事：${sections[current][1]}`;list.append(action)}}search.addEventListener('input',render);category.addEventListener('change',render);render();</script></body></html>
